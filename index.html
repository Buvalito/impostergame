      const audioCtxRef = React.useRef(null);

      React.useEffect(() => {
        if (countdown < 0) return;

        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        const ctx = audioCtxRef.current;

        const playBeep = (frequency, duration, gain = 0.3) => {
          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);

          gainNode.gain.setValueAtTime(gain, ctx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

          oscillator.start(ctx.currentTime);
          oscillator.stop(ctx.currentTime + duration);
        };

        if (countdown > 0) {
          playBeep(440, 0.15, 0.3);
        } else {
          playBeep(880, 0.12, 0.4);
          setTimeout(() => playBeep(1100, 0.3, 0.35), 120);
        }
      }, [countdown]);
    };

                {topGuessers.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: "clamp(14px, 4.3vw, 16px)", width: 22, textAlign: "center", flexShrink: 0 }}>🔍</span>
                    <span style={{ fontSize: 14, color: MUTED, fontWeight: 600, flexShrink: 0 }}>Beste speurder(s) —</span>
                    <span style={{ fontSize: 14, fontWeight: 800, minWidth: 0 }}>
                      {topGuessers.map((n, i) => (
                        <span key={n}>
                          <span style={{ color: playerColors[n] || ACCENT }}>{n}</span>
                          {i < topGuessers.length - 1 && <span style={{ color: MUTED }}>, </span>}
                        </span>
                      ))}
                    </span>
                  </div>
                )}
                {topImposters.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: "clamp(14px, 4.3vw, 16px)", width: 22, textAlign: "center", flexShrink: 0 }}>😈</span>
                    <span style={{ fontSize: 14, color: MUTED, fontWeight: 600, flexShrink: 0 }}>Meeste keer imposter —</span>
                    <span style={{ fontSize: 14, fontWeight: 800, minWidth: 0 }}>
                      {topImposters.map((n, i) => (
                        <span key={n}>
                          <span style={{ color: playerColors[n] || ACCENT }}>{n}</span>
                          {i < topImposters.length - 1 && <span style={{ color: MUTED }}>, </span>}
                        </span>
                      ))}
                    </span>
                  </div>
                )}
                {neverCaught.length > 0 && (
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: "clamp(14px, 4.3vw, 16px)", width: 22, textAlign: "center", flexShrink: 0 }}>🎯</span>
                    <span style={{ fontSize: 14, color: MUTED, fontWeight: 600, flexShrink: 0 }}>Nooit gepakt —</span>
                    <span style={{ fontSize: 14, fontWeight: 800, minWidth: 0 }}>
                      {neverCaught.map((n, i) => (
                        <span key={n}>
                          <span style={{ color: playerColors[n] || GREEN }}>{n}</span>
                          {i < neverCaught.length - 1 && <span style={{ color: MUTED }}>, </span>}
                        </span>
                      ))}
                    </span>
                  </div>
                )}
              </div>
            )}

          </div>
          <div style={{ ...S.footer, display: "flex", flexDirection: "column", gap: 16 }}>
            {winner ? (
              <BigBtn onClick={onNewGame}>🚀 Nieuw spel</BigBtn>
            ) : (
              <BigBtn onClick={onPlayAgain}>🚀 Volgende ronde</BigBtn>
            )}
            <GhostBtn onClick={onReset}>Terug naar hoofdmenu</GhostBtn>
          </div>
        </div>
      );
    };

    // ─── Main ──────────────────────────────────────────────────────────────────

    function ImposterGame() {
      const [phase, setPhase] = useState(PHASES.SETUP);
      const [players, setPlayers] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_players")) || []; } catch { return []; }
      });
      const [playerColors, setPlayerColors] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_player_colors")) || {}; } catch { return {}; }
      });
      const [playerStats, setPlayerStats] = useState({});
      const [newPlayer, setNewPlayer] = useState("");
      const [roundPlayerOrder, setRoundPlayerOrder] = useState([]);
      const [round, setRound] = useState(0);
      const [currentPlayerIdx, setCurrentPlayerIdx] = useState(0);
      const [imposterIdx, setImposterIdx] = useState(null);

      const [customQuestions, setCustomQuestions] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_custom_questions")) || []; } catch { return []; }
      });

      // Welke categorieën zijn ingeschakeld
      const [selectedCategories, setSelectedCategories] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem("imposter_selected_categories"));
          return saved || ["klassiek"];
        } catch {
          return ["klassiek"];
        }
      });

      // Onthoud welke categorieën geselecteerd waren vóór "enkel eigen vragen" werd ingeschakeld
      const savedCategoriesRef = useRef(null);

      // promptPool is computed (niet meer als state)
      const promptPool = useMemo(() => {
        const categoryQs = QUESTION_CATEGORIES
          .filter(c => selectedCategories.includes(c.id))
          .flatMap(c => c.questions);
        return [...categoryQs, ...customQuestions];
      }, [selectedCategories, customQuestions]);

      // availablePrompts: vragen die nog niet zijn gebruikt deze cyclus
      const [availablePrompts, setAvailablePrompts] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_available_prompts")) || [...INITIAL_PROMPTS]; } catch { return [...INITIAL_PROMPTS]; }
      });

      const [currentNormalQ, setCurrentNormalQ] = useState("");
      const [currentImposterQ, setCurrentImposterQ] = useState("");

      const [countdown, setCountdown] = useState(3);
      const [scores, setScores] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_scores")) || {}; } catch { return {}; }
      });
      const [showPrompts, setShowPrompts] = useState(false);
      const [showInstructions, setShowInstructions] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [showStopConfirm, setShowStopConfirm] = useState(false);
      const [isPremium, setIsPremium] = useState(() => {
        try { return JSON.parse(localStorage.getItem("imposter_premium")) || false; } catch { return false; }
      });
      const [showPremiumModal, setShowPremiumModal] = useState(false);
      const [premiumModalReason, setPremiumModalReason] = useState(null);
      const [settings, setSettings] = useState(() => {
        const defaults = { timerEnabled: false, timerSeconds: 60, targetEnabled: false, targetScore: 10, customOnly: false, blindImposter: true };
        try {
          const saved = JSON.parse(localStorage.getItem("imposter_settings"));
          return saved ? { ...defaults, ...saved } : defaults;
        } catch {
          return defaults;
        }
      });
      const [questionError, setQuestionError] = useState("");
      const [playerError, setPlayerError] = useState("");

      // Bereken proactief of er genoeg vragen zijn
      const activePool = settings.customOnly ? customQuestions : promptPool;
      const notEnoughQuestions = activePool.length < 2;
      const noCategoriesSelected = !settings.customOnly && selectedCategories.length === 0;
      const effectiveQuestionError = noCategoriesSelected
        ? "Selecteer minstens één vraagcategorie om het spel te starten."
        : notEnoughQuestions
          ? (settings.customOnly
              ? "'Enkel eigen vragen' is actief. Voeg zelf minstens 2 vragen toe."
              : "Niet genoeg vragen om te starten. Kies minstens 1 vraagcategorie.")
          : questionError;

      const countdownRef = useRef(null);

      // ── LocalStorage persistentie ──────────────────────────────────────────
      useEffect(() => {
        try { localStorage.setItem("imposter_custom_questions", JSON.stringify(customQuestions)); } catch {}
      }, [customQuestions]);

      useEffect(() => {
        try { localStorage.setItem("imposter_players", JSON.stringify(players)); } catch {}
      }, [players]);

      useEffect(() => {
        try { localStorage.setItem("imposter_scores", JSON.stringify(scores)); } catch {}
      }, [scores]);

      useEffect(() => {
        try { localStorage.setItem("imposter_player_colors", JSON.stringify(playerColors)); } catch {}
      }, [playerColors]);

      useEffect(() => {
        try { localStorage.setItem("imposter_available_prompts", JSON.stringify(availablePrompts)); } catch {}
      }, [availablePrompts]);

      useEffect(() => {
        try { localStorage.setItem("imposter_selected_categories", JSON.stringify(selectedCategories)); } catch {}
        // Reset de vragenpool wanneer categorieën wijzigen
        if (!settings.customOnly) {
          setAvailablePrompts([...promptPool]);
        }
      }, [selectedCategories]);

      // ── CustomOnly toggle (synchroon gebatcht om flash te vermijden) ──────────
      const toggleCustomOnly = () => {
        if (!isPremium && !settings.customOnly) {
          openPremiumModal("customOnly");
          return;
        }
        const newVal = !settings.customOnly;
        setSettings(prev => ({ ...prev, customOnly: newVal }));
        setQuestionError("");
        if (newVal) {
          savedCategoriesRef.current = selectedCategories;
          setSelectedCategories([]);
          setAvailablePrompts([...customQuestions]);
        } else {
          const restored = savedCategoriesRef.current || ["klassiek"];
          savedCategoriesRef.current = null;
          setSelectedCategories(restored);
        }
      };

      useEffect(() => {
        try { localStorage.setItem("imposter_settings", JSON.stringify(settings)); } catch {}
      }, [settings]);

      useEffect(() => {
        try { localStorage.setItem("imposter_premium", JSON.stringify(isPremium)); } catch {}
      }, [isPremium]);

      const togglePremium = () => {
        setIsPremium(prev => {
          const next = !prev;
          if (!next) {
            // Premium uitgeschakeld: verwijder premium categorieën uit selectie
            setSelectedCategories(cats => {
              const filtered = cats.filter(id => !PREMIUM_CATEGORIES.includes(id));
              return filtered.length > 0 ? filtered : ["klassiek"];
            });
            // Schakel customOnly uit als actief
            setSettings(s => s.customOnly ? { ...s, customOnly: false } : s);
          }
          return next;
        });
        setShowPremiumModal(false);
      };

      const openPremiumModal = (reason) => {
        setPremiumModalReason(reason);
        setShowPremiumModal(true);
      };

      // ── Categorie toggle ───────────────────────────────────────────────────
      const toggleCategory = (catId) => {
        setSelectedCategories(prev => {
          if (prev.includes(catId)) {
            // Verwijder enkel als er nog andere categorieën zijn (of minstens 1 overblijft)
            if (prev.length <= 1) return prev;
            return prev.filter(id => id !== catId);
          } else {
            return [...prev, catId];
          }
        });
      };

      // ── Spel starten ───────────────────────────────────────────────────────
      const startFreshGame = () => {
        const freshScores = {};
        players.forEach(p => { freshScores[p] = 0; });
        setScores(freshScores);
        setRound(0);
        setTimeout(() => startGame(players), 0);
      };

      const startGame = (p) => {
        let pl = [...(p || players)];
        if (pl.length < 3) return;

        const currentActivePool = settings.customOnly ? customQuestions : promptPool;
        if (currentActivePool.length < 2) {
          setQuestionError(
            settings.customOnly
              ? "'Enkel eigen vragen' actief. Voeg minstens 2 vragen toe."
              : "Niet genoeg vragen. Voeg minstens 2 eigen vragen toe."
          );
          setPhase(PHASES.SETUP);
          return;
        }
        setQuestionError("");

        pl = pl.sort(() => Math.random() - 0.5);
        setRoundPlayerOrder(pl);
        setImposterIdx(Math.floor(Math.random() * pl.length));

        setAvailablePrompts(prev => {
          const pool = prev.filter(q => currentActivePool.includes(q));
          const refilled = pool.length >= 2 ? pool : [...currentActivePool];
          const shuffled = [...refilled].sort(() => 0.5 - Math.random());
          const nQ = shuffled[0];
          const iQ = shuffled[1];
          setCurrentNormalQ(nQ);
          setCurrentImposterQ(iQ);
          return shuffled.slice(2);
        });

        setCurrentPlayerIdx(0);
        setRound(r => r + 1);
        setPhase(PHASES.QUESTION_TURN);
      };

      const addCustomPrompt = (text) => {
        setCustomQuestions(prev => [...prev, text]);
        setAvailablePrompts(prev => [...prev, text]);
        setQuestionError("");
      };

      const removeCustomPrompt = (textToRemove) => {
        setCustomQuestions(prev => prev.filter(q => q !== textToRemove));
        setAvailablePrompts(prev => prev.filter(q => q !== textToRemove));
      };

      const addPlayer = () => {
        const name = newPlayer.trim();
        if (!name) return;
        if (players.includes(name)) {
          setPlayerError(`"${name}" is al toegevoegd.`);
          return;
        }
        const effectiveMax = isPremium ? MAX_PLAYERS : FREE_MAX_PLAYERS;
        if (players.length >= effectiveMax) {
          if (!isPremium) {
            openPremiumModal("players");
          }
          return;
        }
        if (players.length < MAX_PLAYERS) {
          setPlayers(prev => [...prev, name]);
          setScores(prev => ({ ...prev, [name]: prev[name] || 0 }));
          setPlayerColors(prev => {
            const usedColors = Object.values(prev);
            const available = PLAYER_COLORS.filter(c => !usedColors.includes(c));
            const pool = available.length > 0 ? available : PLAYER_COLORS;
            const color = pool[Math.floor(Math.random() * pool.length)];
            return { ...prev, [name]: color };
          });
          setNewPlayer("");
          setPlayerError("");
        }
      };

      const removePlayer = (i) => {
        setPlayers(prev => prev.filter((_, idx) => idx !== i));
      };

      const doneReading = () => {
        if (currentPlayerIdx + 1 < roundPlayerOrder.length) {
          setCurrentPlayerIdx(i => i + 1);
          setPhase(PHASES.QUESTION_TURN);
        } else {
          setPhase(PHASES.WRITE);
        }
      };

      const startCountdown = () => { setCountdown(3); setPhase(PHASES.COUNTDOWN); };

      useEffect(() => {
        if (phase !== PHASES.COUNTDOWN) return;
        countdownRef.current = setInterval(() => {
          setCountdown(c => {
            if (c <= 1) { clearInterval(countdownRef.current); setPhase(PHASES.SHOW_NAMES); return 0; }
            return c - 1;
          });
        }, 1000);
        return () => clearInterval(countdownRef.current);
      }, [phase]);

      const handleResult = (winnersOrFalse) => {
        const imposterName = roundPlayerOrder[imposterIdx];
        const imposterFound = winnersOrFalse !== false;
        setScores(prev => {
          const s = { ...prev };
          if (imposterFound) {
            winnersOrFalse.forEach(p => { s[p] = (s[p] || 0) + 1; });
          } else {
            s[imposterName] = (s[imposterName] || 0) + 2;
          }
          return s;
        });
        setPlayerStats(prev => {
          const s = { ...prev };
          if (!s[imposterName]) s[imposterName] = { timesImposter: 0, timesCaught: 0 };
          s[imposterName] = {
            ...s[imposterName],
            timesImposter: (s[imposterName].timesImposter || 0) + 1,
            timesCaught: (s[imposterName].timesCaught || 0) + (imposterFound ? 1 : 0),
          };
          if (imposterFound) {
            winnersOrFalse.forEach(p => {
              if (!s[p]) s[p] = { timesImposter: 0, timesCaught: 0, timesGuessed: 0 };
              s[p] = { ...s[p], timesGuessed: (s[p].timesGuessed || 0) + 1 };
            });
          }
          return s;
        });
        setPhase(PHASES.SCOREBOARD);
      };

      const resetGame = () => {
        setPhase(PHASES.SETUP);
        setRound(0);
        const freshScores = {};
        players.forEach(p => { freshScores[p] = 0; });
        setScores(freshScores);
        setPlayerStats({});
        setImposterIdx(null);
        setAvailablePrompts([...promptPool]);
        try {
          localStorage.setItem("imposter_scores", JSON.stringify(freshScores));
          localStorage.removeItem("imposter_available_prompts");
        } catch {}
      };

      const stopGame = () => {
        resetGame();
      };

      const isInGame = phase !== PHASES.SETUP;

      return (
        <React.Fragment>
          {isInGame && (
            <button
              className="btn-active"
              onClick={() => setShowStopConfirm(true)}
              style={{
                position: "fixed",
                top: 24,
                right: "max(24px, calc((100vw - 500px) / 2 + 24px))",
                background: "rgba(255,255,255,0.1)",
                border: "none",
                color: TEXT,
                width: 40,
                height: 40,
                borderRadius: "50%",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: "clamp(20px, 6.4vw, 24px)",
                fontWeight: 400,
                cursor: "pointer",
                flexShrink: 0,
                zIndex: 50,
              }}
            >×</button>
          )}
          {showStopConfirm && (
            <div style={{
              position: "fixed", inset: 0, zIndex: 200,
              background: "rgba(17,17,17,0.85)",
              backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)",
              display: "flex", alignItems: "center", justifyContent: "center",
              padding: "24px",
              fontFamily: "'Outfit', sans-serif",
              animation: "fadeIn 0.15s ease-in-out",
            }}>
              <style>{css}</style>
              <div style={{
                background: CARD, border: `1px solid ${BORDER}`,
                borderRadius: 20, padding: "32px 28px",
                maxWidth: 360, width: "100%", textAlign: "center",
              }}>
                <div style={{ fontSize: "clamp(36px, 12.8vw, 48px)", marginBottom: 16 }}>🚪</div>
                <div style={{ fontSize: "clamp(18px, 5.9vw, 22px)", fontWeight: 800, color: TEXT, marginBottom: 10, letterSpacing: "-0.02em" }}>
                  Spel verlaten?
                </div>
                <div style={{ fontSize: "clamp(14px, 4.3vw, 16px)", color: MUTED, fontWeight: 500, lineHeight: 1.55, marginBottom: 28 }}>
                  De huidige ronde gaat verloren en de scores worden gereset.
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <BigBtn bg={RED} color="#fff" onClick={() => { setShowStopConfirm(false); stopGame(); }}>
                    Ja, stoppen
                  </BigBtn>
                  <GhostBtn onClick={() => setShowStopConfirm(false)}>
                    Terug naar spel
                  </GhostBtn>
                </div>
              </div>
            </div>
          )}
          {showInstructions && (
            <InstructionsModal onClose={() => setShowInstructions(false)} />
          )}
          {showPrompts && (
            <PromptsModal
              customQuestions={customQuestions}
              onAdd={addCustomPrompt}
              onDelete={removeCustomPrompt}
              onClose={() => setShowPrompts(false)}
            />
          )}
          {showSettings && (
            <SettingsModal
              settings={settings}
              onSave={setSettings}
              onClose={() => setShowSettings(false)}
              isPremium={isPremium}
              onTogglePremium={togglePremium}
            />
          )}

          {showPremiumModal && (
            <PremiumModal
              reason={premiumModalReason}
              isPremium={isPremium}
              onActivate={togglePremium}
              onClose={() => setShowPremiumModal(false)}
              devMode={PREMIUM_DEV_MODE}
            />
          )}
          {phase === PHASES.SETUP && (
            <SetupScreen
              players={players}
              newPlayer={newPlayer}
              setNewPlayer={setNewPlayer}
              addPlayer={addPlayer}
              removePlayer={removePlayer}
              startGame={() => startGame()}
              onOpenPrompts={() => setShowPrompts(true)}
              onOpenInstructions={() => setShowInstructions(true)}
              onOpenSettings={() => setShowSettings(true)}
              questionError={effectiveQuestionError}
              playerError={playerError}
              setPlayerError={setPlayerError}
              settings={settings}
              onUpdateSettings={(key, val) => setSettings(prev => ({ ...prev, [key]: val }))}
              onToggleCustomOnly={toggleCustomOnly}
              playerColors={playerColors}
              selectedCategories={selectedCategories}
              onToggleCategory={toggleCategory}
              promptPoolCount={promptPool.length}
              isPremium={isPremium}
              onOpenPremium={openPremiumModal}
            />
          )}
          {phase === PHASES.QUESTION_TURN && (
            <QuestionTurnScreen player={roundPlayerOrder[currentPlayerIdx]} round={round} current={currentPlayerIdx + 1} total={roundPlayerOrder.length} onShow={() => setPhase(PHASES.SHOW_QUESTION)} playerColor={playerColors[roundPlayerOrder[currentPlayerIdx]]} />
          )}
          {phase === PHASES.SHOW_QUESTION && (
            <ShowQuestionScreen isImposter={currentPlayerIdx === imposterIdx} question={currentPlayerIdx === imposterIdx ? currentImposterQ : currentNormalQ} isLast={currentPlayerIdx + 1 === roundPlayerOrder.length} onDone={doneReading} blindImposter={settings.blindImposter} />
          )}
          {phase === PHASES.WRITE && (
            <WriteScreen onReady={() => setPhase(PHASES.REVEAL_QUESTION)} />
          )}
          {phase === PHASES.COUNTDOWN && (
            <CountdownScreen countdown={countdown} />
          )}
          {phase === PHASES.SHOW_NAMES && (
            <ShowNamesScreen onReveal={() => setPhase(PHASES.RESULT)} timerEnabled={settings.timerEnabled} timerSeconds={settings.timerSeconds} />
          )}
          {phase === PHASES.REVEAL_QUESTION && (
            <RevealQuestionScreen
              normalQuestion={currentNormalQ}
              onDone={() => startCountdown()}
            />
          )}
          {phase === PHASES.RESULT && (
            <ResultScreen imposterName={roundPlayerOrder[imposterIdx]} normalQ={currentNormalQ} imposterQ={currentImposterQ} onFound={() => setPhase(PHASES.VOTE)} onNotFound={() => handleResult(false)} playerColors={playerColors} />
          )}
          {phase === PHASES.VOTE && (
            <VoteScreen
              players={roundPlayerOrder}
              imposterName={roundPlayerOrder[imposterIdx]}
              onDone={(winners) => handleResult(winners)}
              playerColors={playerColors}
            />
          )}
          {phase === PHASES.SCOREBOARD && (
            <ScoreboardScreen
              players={players}
              scores={scores}
              round={round}
              onPlayAgain={() => startGame()}
              onNewGame={startFreshGame}
              onReset={resetGame}
              targetEnabled={settings.targetEnabled}
              targetScore={settings.targetScore}
              playerColors={playerColors}
              playerStats={playerStats}
            />
          )}
        </React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ImposterGame />);
  </script>
</body>
</html>
